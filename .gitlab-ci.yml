# GitLab CI/CD Pipeline for Nagpur Connect
image: node:20-alpine

stages:
  - build

build:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .next/cache/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  only:
    - main
    - merge_requests
